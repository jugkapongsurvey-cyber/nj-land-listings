<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="'IBM Plex Sans Thai','Noto Sans Thai','Leelawadee UI',Tahoma,sans-serif">
  <rect width="900" height="400" fill="#FFFFFF"/>
  <text x="450" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#12315F">ที่ดินชัวร์ — แบบร่างโลโก้ 3 แนวทาง</text>
  <text x="450" y="64" text-anchor="middle" font-size="13" fill="#7186A3">เลือกมา 1 แบบ แล้วผมจะทำไฟล์ครบชุด (ไอคอน · รูปโปรไฟล์ · แนวนอน · ขาวดำ) ให้</text>

  <!-- ========== แบบ A: แปลงที่ดิน + เครื่องหมายถูก ========== -->
  <g transform="translate(60,110)">
    <rect x="-20" y="-20" width="200" height="200" rx="16" fill="#F7F9FC" stroke="#E4E9F2"/>
    <g transform="translate(10,10) scale(1.1)" stroke-linejoin="round" stroke-linecap="round">
      <path d="M18 38 L76 20 L98 74 L32 96 Z" fill="#EAF1FC" stroke="#12315F" stroke-width="6"/>
      <path d="M18 38 L98 74" stroke="#9DBBE4" stroke-width="3" stroke-dasharray="7 7"/>
      <circle cx="18" cy="38" r="7" fill="#12315F"/>
      <circle cx="76" cy="20" r="7" fill="#12315F"/>
      <circle cx="32" cy="96" r="7" fill="#12315F"/>
      <circle cx="97" cy="87" r="25" fill="#16A34A" stroke="#FFFFFF" stroke-width="6"/>
      <path d="M87 87 l7 8 14-16" fill="none" stroke="#FFFFFF" stroke-width="6"/>
    </g>
    <text x="80" y="212" text-anchor="middle" font-size="16" font-weight="700" fill="#12315F">แบบ A · แปลงที่ดิน + ยืนยัน</text>
    <text x="80" y="236" text-anchor="middle" font-size="12.5" fill="#556376">จุดมุม = หมุดหลักเขต · เส้นประ = แนวเขต</text>
    <text x="80" y="256" text-anchor="middle" font-size="12.5" font-weight="700" fill="#16A34A">แนะนำ — เฉพาะตัวกับงานรังวัด</text>
  </g>

  <!-- ========== แบบ B: หมุดปักที่ดิน + เช็ค ========== -->
  <g transform="translate(350,110)">
    <rect x="-20" y="-20" width="200" height="200" rx="16" fill="#F7F9FC" stroke="#E4E9F2"/>
    <g transform="translate(15,8) scale(1.15)" stroke-linejoin="round" stroke-linecap="round">
      <path d="M55 8 C34 8 17 25 17 46 c0 27 38 61 38 61 s38-34 38-61 C93 25 76 8 55 8 z" fill="#12315F"/>
      <circle cx="55" cy="46" r="21" fill="#FFFFFF"/>
      <path d="M45 46 l7 8 14-16" fill="none" stroke="#16A34A" stroke-width="6"/>
      <ellipse cx="55" cy="118" rx="34" ry="8" fill="#DCE7F6"/>
    </g>
    <text x="80" y="212" text-anchor="middle" font-size="16" font-weight="700" fill="#12315F">แบบ B · หมุดปัก + ยืนยัน</text>
    <text x="80" y="236" text-anchor="middle" font-size="12.5" fill="#556376">อ่านง่ายที่สุด เข้าใจทันทีว่าเรื่องทำเล</text>
    <text x="80" y="256" text-anchor="middle" font-size="12.5" fill="#8598B4">แต่หมุดแผนที่มีคนใช้เยอะ ไม่ค่อยต่าง</text>
  </g>

  <!-- ========== แบบ C: โล่ + แปลงที่ดิน ========== -->
  <g transform="translate(640,110)">
    <rect x="-20" y="-20" width="200" height="200" rx="16" fill="#F7F9FC" stroke="#E4E9F2"/>
    <g transform="translate(12,10) scale(1.1)" stroke-linejoin="round" stroke-linecap="round">
      <path d="M57 8 L102 26 v36 c0 30-20 48-45 58 -25-10-45-28-45-58 V26 Z" fill="#EAF1FC" stroke="#12315F" stroke-width="6"/>
      <path d="M30 50 L57 40 L84 52 L57 64 Z" fill="none" stroke="#12315F" stroke-width="5"/>
      <path d="M42 79 l10 11 20-22" fill="none" stroke="#16A34A" stroke-width="7"/>
    </g>
    <text x="80" y="212" text-anchor="middle" font-size="16" font-weight="700" fill="#12315F">แบบ C · โล่ + แปลงที่ดิน</text>
    <text x="80" y="236" text-anchor="middle" font-size="12.5" fill="#556376">สื่อ "ชัวร์ = ปลอดภัย มั่นใจ" ชัดที่สุด</text>
    <text x="80" y="256" text-anchor="middle" font-size="12.5" fill="#8598B4">แต่โล่ดูคล้ายบริษัทประกัน/ความปลอดภัย</text>
  </g>

  <text x="450" y="386" text-anchor="middle" font-size="12" fill="#9AABC2">สีที่ใช้: กรมท่า #12315F (เดียวกับระบบ NJ) · เขียวยืนยัน #16A34A · ฟ้าอ่อน #EAF1FC</text>
</svg>
