    <path d="M34 56 L66 42 L94 60 L60 76 Z" fill="none" stroke="#FFFFFF" stroke-width="5"/>
    <circle cx="34" cy="56" r="4.5" fill="#FFFFFF"/>
    <circle cx="66" cy="42" r="4.5" fill="#FFFFFF"/>
    <circle cx="94" cy="60" r="4.5" fill="#FFFFFF"/>
    <path d="M42 89 l12 13 26-29" fill="none" stroke="#22C55E" stroke-width="9"/>
  </g>
